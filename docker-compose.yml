services:

  # ==========================================
  # SHARD 1 PRIMARY (Node Fisik Shard 1 - Port 5435)
  # Menampung: Reference Tables & Data Transaksi Periode Lama
  # ==========================================
  postgres-shard1:
    image: postgres:17
    container_name: postgres-shard1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: sales
    ports:
      - "5435:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
      - ./shards/shard1_init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./shards/reference_tables.sql:/docker-entrypoint-initdb.d/reference_tables.sql:ro
      - ./shards/shard1_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=64MB
      - -c
      - listen_addresses=*
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # SHARD 2 PRIMARY (Node Fisik Shard 2 - Port 5436)
  # Menampung: Reference Tables & Data Transaksi Periode Baru
  # ==========================================
  postgres-shard2:
    image: postgres:17
    container_name: postgres-shard2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: sales
    ports:
      - "5436:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data
      - ./shards/shard2_init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./shards/reference_tables.sql:/docker-entrypoint-initdb.d/reference_tables.sql:ro
      - ./shards/shard2_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=64MB
      - -c
      - listen_addresses=*
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # COORDINATOR NODE (Port 5432)
  # Menampung: Skema Partisi orders & payments via postgres_fdw
  # ==========================================
  postgres-primary:
    image: postgres:17
    container_name: postgres-primary
    restart: unless-stopped
    depends_on:
      postgres-shard1:
        condition: service_healthy
      postgres-shard2:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: sales
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./db.sql:/docker-entrypoint-initdb.d/02-db.sql:ro
    command:
      - postgres
      - -c
      - listen_addresses=*
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # STANDBY 1 - REPLIKA STREAMING SHARD 1 (Port 5433)
  # Menampung: Salinan Replikasi Shard 1 secara Real-Time
  # ==========================================
  init-replica:
    image: postgres:17
    container_name: init-replica
    depends_on:
      postgres-shard1:
        condition: service_healthy
    environment:
      PGPASSWORD: replica123
    volumes:
      - replica_data:/var/lib/postgresql/data
    networks:
      - pg-network
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        chown -R postgres:postgres /var/lib/postgresql/data
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Membuat PostgreSQL Standby 1 (Replika Streaming Shard 1)..."
          rm -rf /var/lib/postgresql/data/*
          gosu postgres pg_basebackup \
            -h postgres-shard1 \
            -U replicator \
            -D /var/lib/postgresql/data \
            -Fp \
            -Xs \
            -P \
            -R \
            -S standby1
        else
          echo "Standby 1 sudah tersedia."
        fi

  postgres-standby:
    image: postgres:17
    container_name: postgres-standby
    restart: unless-stopped
    depends_on:
      init-replica:
        condition: service_completed_successfully
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # STANDBY 2 - REPLIKA STREAMING SHARD 2 (Port 5434)
  # Menampung: Salinan Replikasi Shard 2 secara Real-Time
  # ==========================================
  init-replica-2:
    image: postgres:17
    container_name: init-replica-2
    depends_on:
      postgres-shard2:
        condition: service_healthy
    environment:
      PGPASSWORD: replica123
    volumes:
      - replica2_data:/var/lib/postgresql/data
    networks:
      - pg-network
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        chown -R postgres:postgres /var/lib/postgresql/data
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Membuat PostgreSQL Standby 2 (Replika Streaming Shard 2)..."
          rm -rf /var/lib/postgresql/data/*
          gosu postgres pg_basebackup \
            -h postgres-shard2 \
            -U replicator \
            -D /var/lib/postgresql/data \
            -Fp \
            -Xs \
            -P \
            -R \
            -S standby2
        else
          echo "Standby 2 sudah tersedia."
        fi

  postgres-standby-2:
    image: postgres:17
    container_name: postgres-standby-2
    restart: unless-stopped
    depends_on:
      init-replica-2:
        condition: service_completed_successfully
    ports:
      - "5434:5432"
    volumes:
      - replica2_data:/var/lib/postgresql/data
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # AUTO FAILOVER MANAGER (Watchdog Shard 1)
  # ==========================================
  failover-manager:
    image: postgres:17
    container_name: failover-manager
    restart: unless-stopped
    depends_on:
      postgres-shard1:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      postgres-standby:
        condition: service_healthy
    environment:
      PRIMARY_SHARD: postgres-shard1
      STANDBY_SHARD: postgres-standby
      COORDINATOR_HOST: postgres-primary
      POSTGRES_DB: sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - ./failover/failover.sh:/usr/local/bin/failover.sh:ro
    networks:
      - pg-network
    entrypoint: ["/bin/bash", "/usr/local/bin/failover.sh"]


  # ==========================================
  # HAPROXY LOAD BALANCER & ROUTING
  # ==========================================
  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy-lb
    restart: unless-stopped
    depends_on:
      - postgres-primary
      - postgres-standby
      - postgres-standby-2
    ports:
      - "5000:5000"   # Port Routing WRITE & COORDINATOR
      - "5001:5001"   # Port Routing READ (Load Balancing Standby 1 & 2)
      - "7000:7000"   # Web Dashboard HAProxy Stats
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - pg-network


volumes:
  primary_data:
  replica_data:
  replica2_data:
  shard1_data:
  shard2_data:

networks:
  pg-network:
    driver: bridge
