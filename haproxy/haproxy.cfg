global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# ====================================================================
# 1. HAProxy Web Statistics Dashboard (Port 7000)
#    Akses via browser: http://localhost:7000
# ====================================================================
frontend stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
    stats admin if TRUE

# ====================================================================
# 2. ROUTING WRITE / COORDINATOR (Port 5000)
#    Mengarahkan seluruh traffic tulis & query global ke Coordinator.
# ====================================================================
frontend pgsql_write_front
    bind *:5000
    mode tcp
    default_backend pgsql_write_back

backend pgsql_write_back
    mode tcp
    balance roundrobin
    option tcp-check
    server pg_coordinator postgres-primary:5432 check fall 3 rise 2

# ====================================================================
# 3. ROUTING READ / REPLICAS (Port 5001)
#    Melakukan Load Balancing (Round-Robin) untuk traffic baca
#    ke Standby 1 (Replika Shard 1) dan Standby 2 (Replika Shard 2).
# ====================================================================
frontend pgsql_read_front
    bind *:5001
    mode tcp
    default_backend pgsql_read_back

backend pgsql_read_back
    mode tcp
    balance roundrobin
    option tcp-check
    # Load balancing round-robin antar replica shard
    server pg_standby1 postgres-standby:5432 check
    server pg_standby2 postgres-standby-2:5432 check
    # Fallback darurat ke coordinator jika kedua standby down
    server pg_coordinator postgres-primary:5432 check backup
